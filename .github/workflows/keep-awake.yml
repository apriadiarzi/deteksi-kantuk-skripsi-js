# Kunjungi aplikasi Streamlit secara berkala supaya tidak ditidurkan Streamlit Community Cloud
# (aplikasi tidur setelah 12 jam tanpa pengunjung). Kalau sudah tidur, aplikasi dibangunkan.
# Pengunjung ini hanya membuka halaman: tidak pernah masuk, mendaftar, atau mengisi formulir.
name: Keep Streamlit app awake

on:
  schedule:
    # 00:17, 11:17, dan 22:17 UTC (07:17, 18:17, 05:17 WIB). "Tiap 11 jam" tidak bisa ditulis persis
    # di cron karena 24 tidak habis dibagi 11; jadwal ini menjaga jedanya tidak pernah lebih dari 11 jam
    # (22:17 ke 00:17 hanya 2 jam karena cron dimulai ulang tiap hari).
    - cron: "17 0,11,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://deteksi-kantuk-js.streamlit.app/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Hanya untuk workflow ini; sengaja tidak masuk requirements.txt aplikasi.
      - name: Install Playwright dan Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Kunjungi atau bangunkan aplikasi
        run: python scripts/keep_awake.py

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keep-awake-screenshot
          path: keep_awake.png
          retention-days: 3
          if-no-files-found: warn
