# Kunjungi aplikasi Streamlit secara berkala supaya tidak ditidurkan Streamlit Community Cloud
# (aplikasi tidur setelah 12 jam tanpa pengunjung). Kalau sudah tidur, aplikasi dibangunkan.
name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://deteksi-kantuk-js.streamlit.app/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Hanya untuk workflow ini; sengaja tidak masuk requirements.txt aplikasi.
      - name: Install Playwright dan Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Kunjungi atau bangunkan aplikasi
        run: python scripts/keep_awake.py

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keep-awake-screenshot
          path: keep_awake.png
          retention-days: 3
          if-no-files-found: warn
